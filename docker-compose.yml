services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gifserver
      POSTGRES_USER: gifserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gifserver}
    # Bound to localhost only: reachable by `cargo run` on the host for dev,
    # and by the app container over the internal network, but not the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gifserver"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    # Bound to localhost only: the host's nginx reverse proxy reaches it here;
    # the public internet never hits the app directly (required for the
    # X-Forwarded-For-based rate limiter to be trustworthy).
    ports:
      - "127.0.0.1:8847:8847"
    environment:
      # DATABASE_URL is built from POSTGRES_PASSWORD so the password lives in
      # exactly one place and the host is always the `db` service.
      DATABASE_URL: postgres://gifserver:${POSTGRES_PASSWORD:-gifserver}@db:5432/gifserver
      STORAGE_PATH: /app/storage
      HOST: 0.0.0.0
      PORT: 8847
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?set MATRIX_SERVER_NAME in .env}
      MATRIX_FEDERATION_URL: ${MATRIX_FEDERATION_URL:?set MATRIX_FEDERATION_URL in .env}
      MATRIX_ADMIN_MXIDS: ${MATRIX_ADMIN_MXIDS:-}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-10GB}
      PER_USER_STORAGE_BYTES: ${PER_USER_STORAGE_BYTES:-1GB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8847/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      # Internal network for app <-> db traffic.
      default: {}
      # Join the pre-existing nginx network so the nginx container can reach
      # this app as http://gif-server:8847 (no host port needed for that path).
      nginx:
        aliases:
          - gif-server

volumes:
  postgres_data:

networks:
  default:
  # The nginx stack's network, created outside this compose project.
  nginx:
    external: true
