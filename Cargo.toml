[package]
name = "gif-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
gif = "0.14"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"
hex = "0.4"
base64 = "0.22"
time = { version = "0.3", features = ["serde"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tower_governor = "0.8"

[dev-dependencies]
sqlx = { version = "0.8", features = ["macros", "migrate"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
walkdir = "2"
